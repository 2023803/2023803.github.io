---
layout: default
---

<article class="post">
  <a class="back-link" href="/">← 返回主页 / Back home</a>
  <header class="post-header">
    <p class="eyebrow">随笔 · Notes</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
